name: Alerta de passagens
on:
  schedule:
    - cron: "0 11,23 * * *"   # todo dia as 08h e 20h (Brasilia)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  busca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python busca_passagens.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python gerar_dados.py
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add historico.csv docs/data.json && git commit -m "atualiza historico" || echo "sem mudancas"
          git pull --rebase && git push
